# Route ALSA default through a plug device pointed at vc4-hdmi-0 so
# Brume's cpal "default" output lands on the panel's HDMI speakers.
# plug handles the sample-rate conversion for sources that don't
# match HDMI's native 48 kHz (e.g. 44.1 kHz playback).
#
# Meridian (UAC2 gadget capture for DAW tether) is a separate device
# (card UAC2Gadget) that gets opened by name from Brume when enabled.
pcm.!default {
    type plug
    slave.pcm "hw:vc4hdmi0,0"
}
ctl.!default {
    type hw
    card vc4hdmi0
}
